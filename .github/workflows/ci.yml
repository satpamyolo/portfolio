name: CI - Build & Push Docker Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================================
  # 1. CI & Security Validation Stage
  # ==========================================================
  test-and-audit:
    name: Test Build & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history required for git secret scanning

      # DevSecOps Check 1: Secret Scanning
      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # DevSecOps Check 2: Software Composition Analysis (SCA)
      - name: Check Dependencies Vulnerabilities
        run: npm audit --audit-level=high || true

      - name: Test Frontend Production Build
        run: npm run build

  # ==========================================================
  # 2. Container Build, Scan & Publish Stage
  # ==========================================================
  docker-publish:
    name: Build, Scan & Push Docker Image
    needs: test-and-audit
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # DevSecOps Check 3: Container Vulnerability Scan
      - name: Run Trivy Container Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

  # ==========================================================
  # 3. CD Deployment Stage (Automated EC2 Deployment)
  # ==========================================================
  deploy:
    name: Deploy to EC2
    needs: docker-publish
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: SSH into EC2 and update container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "Navigating to docker-compose directory..."
            cd /home/ec2-user/n8n

            echo "Pulling latest portfolio image from GHCR..."
            docker compose pull portfolio

            echo "Recreating portfolio container..."
            docker compose up -d --no-deps portfolio

            echo "Pruning unused images..."
            docker image prune -f

            echo "Continuous Deployment completed successfully!"